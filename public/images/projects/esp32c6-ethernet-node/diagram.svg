</text><text x="195" y="378" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9FB3C8">Native USB · flash / JTAG</text><text x="195" y="399" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9FB3C8">ESD array · 90 Ω pair</text><path d="M330 360 H390 V375 H450" fill="none" stroke="#2D6A8E" stroke-width="2.5"/><circle cx="330" cy="360" r="4" fill="#2D6A8E"/><circle cx="450" cy="375" r="4" fill="#2D6A8E"/><rect x="60" y="461.67" width="270" height="90" rx="14" fill="#111F35" stroke="#2D6A8E" stroke-width="2.5"/><text x="195" y="498.67" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F6FA">User I/O</text><text x="195" y="524.6700000000001" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9FB3C8">2 keys · 2 LEDs</text><text x="195" y="545.6700000000001" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9FB3C8">BOOT · RESET · UART header</text><path d="M330 506.67 H390 V425 H450" fill="none" stroke="#2D6A8E" stroke-width="2.5"/><circle cx="330" cy="506.67" r="4" fill="#2D6A8E"/><circle cx="450" cy="425" r="4" fill="#2D6A8E"/><rect x="870" y="168.33" width="270" height="90" rx="14" fill="#111F35" stroke="#2D6A8E" stroke-width="2.5"/><text x="1005" y="205.33" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F6FA">W5500 Ethernet</text><text x="1005" y="231.33" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9FB3C8">Hardwired TCP/IP · 10/100</text><text x="1005" y="252.33" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9FB3C8">→ RJ45 with magnetics</text><path d="M750 325 H810 V213.33 H870" fill="none" stroke="#2D6A8E" stroke-width="2.5"/><circle cx="750" cy="325" r="4" fill="#2D6A8